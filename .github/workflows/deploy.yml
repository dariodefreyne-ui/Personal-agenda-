name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - Main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install

      - name: Create .env.local from GitHub secret
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Build app (genereert ook firebase-messaging-sw.js)
        run: npm run build

      # Officiële Google-auth: schrijft de service-account-credentials weg en
      # exporteert GOOGLE_APPLICATION_CREDENTIALS voor alle volgende stappen.
      # Betrouwbaarder dan de handmatige echo-aanpak (geen flaky auth meer).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.20.0

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firestore rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), opnieuw na 60s..."; sleep 60
          done

      - name: Deploy Firestore indexes
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), opnieuw na 60s..."; sleep 60
          done

      - name: Deploy Storage rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), opnieuw na 60s..."; sleep 60
          done

      - name: Deploy Cloud Functions
        run: |
          for i in 1 2 3; do
            firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --force && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), opnieuw na 60s..."; sleep 60
          done

      - name: Deploy Hosting
        run: |
          for i in 1 2 3; do
            firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), opnieuw na 60s..."; sleep 60
          done
